openapi: 3.0.3
info:
  title: Demo shop
  version: "1.0.0"
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, price]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        price:
                          type: number
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          example: mug
          schema:
            type: string
      responses:
        "200":
          description: one item
          content:
            application/json:
              schema:
                type: object
                required: [id, name, price]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  price:
                    type: number
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, qty]
              properties:
                sku:
                  type: string
                qty:
                  type: integer
            example:
              sku: mug
              qty: 1
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
